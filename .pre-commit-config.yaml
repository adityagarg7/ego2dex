# Run `pre-commit install` once, then hooks run on every commit.
# Keep versions roughly aligned with pyproject.toml [dev] + CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]  # block accidental weights/videos/frames
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: ["types-PyYAML", "pydantic>=2.5"]
        args: ["--ignore-missing-imports"]
        # Non-blocking type checks: keep the team unblocked while typing grows.
        verbose: true

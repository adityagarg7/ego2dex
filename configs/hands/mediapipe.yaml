# MediaPipe Hand Landmarker (Apache-2.0, CPU, no MANO). Smoke/default-light path.
family: hands
name: mediapipe
enabled: true
params:
  num_hands: 2
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  # Path to hand_landmarker.task (download separately, ~7 MB). Or set
  # EGO2DEX_MEDIAPIPE_TASK. Only needed for a LIVE (non-dry-run) run.
  model_path: null
